name: custodian-kafka-pilot

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:9092
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "127.0.0.1:9092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test:
        - CMD-SHELL
        - rpk cluster health | grep -E 'Healthy:.+true' || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  redpanda_data:
